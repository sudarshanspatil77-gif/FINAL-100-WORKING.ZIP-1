services:
  - type: web
    name: nifty-bot-support-reversal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: TIMEFRAME_MIN
        value: "5"
      - key: RISK_PERCENT
        value: "0.5"
      - key: RISK_REWARD
        value: "2.0"
      - key: MAX_TRADES_PER_DAY
        value: "3"
      - key: DAILY_LOSS_LIMIT_PERCENT
        value: "1.5"
